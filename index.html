<!doctype html>
<!--
      A classe "dark" nunca era aplicada em lugar nenhum do projeto. Como o
      tailwind está em darkMode: ["class"], TODO componente shadcn (diálogos,
      selects, popovers, abas, menus) resolvia bg-muted / bg-popover /
      bg-background pela paleta CLARA do :root — daí os blocos cinza-claros
      que apareciam soltos no meio de uma interface preta.
    -->
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>VELVET MUSIC</title>
    <meta name="description" content="VELVET MUSIC — streaming, lançamentos e rankings dos artistas do selo." />
    <meta name="theme-color" content="#050506" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" href="/logo2.png?v=2" />
    <link rel="apple-touch-icon" href="/logo2.png?v=2" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Pré-carrega o logo: ele aparece na abertura e na sidebar, então
         vale antecipar. Depois de otimizado são 34 KB, não 2,2 MB. -->
    <link rel="preload" as="image" href="/logo.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VELVET MUSIC" />
    <meta property="og:title" content="VELVET MUSIC" />
    <meta property="og:description" content="Streaming, lançamentos e rankings dos artistas do selo." />
    <meta property="og:image" content="/logo.png?v=2" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* Pinta o fundo antes do primeiro byte de CSS do bundle chegar —
         sem isso o navegador mostra um flash branco antes do app montar. */
      html, body { background: #0a0a0c; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
